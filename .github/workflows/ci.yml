name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: arena-stark

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, redis
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: arena-stark/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint PHP (Pint)
        run: ./vendor/bin/pint --test

      - name: Lint JS/TS
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run tests
        run: php artisan test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
