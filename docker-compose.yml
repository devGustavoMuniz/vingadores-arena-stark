services:
  app:
    build:
      context: ./arena-stark
      dockerfile: Dockerfile
    container_name: arena-stark-app
    restart: unless-stopped
    working_dir: /var/www
    # O bind mount esconde o vendor/ da imagem, entao instala as dependencias ao subir
    command: sh -c "composer install --no-interaction --prefer-dist && php-fpm"
    volumes:
      - ./arena-stark:/var/www
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: arena_stark
      DB_USERNAME: arena
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arena-network

  nginx:
    image: nginx:1.27-alpine
    container_name: arena-stark-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./arena-stark:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - arena-network

  mysql:
    image: mysql:8.4
    container_name: arena-stark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: arena_stark
      MYSQL_USER: arena
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uarena", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arena-network

  redis:
    image: redis:7.4-alpine
    container_name: arena-stark-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arena-network

  node:
    # Mesma imagem do app: o plugin Wayfinder do Vite precisa do PHP para gerar as rotas
    build:
      context: ./arena-stark
      dockerfile: Dockerfile
    container_name: arena-stark-node
    working_dir: /var/www
    volumes:
      - ./arena-stark:/var/www
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done && npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - arena-network

volumes:
  mysql-data:
  redis-data:

networks:
  arena-network:
    driver: bridge
